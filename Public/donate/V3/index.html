<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donate - AllIsWell</title>
    
    <!-- Bootstrap CSS -->
    <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Main CSS File -->
    <link href="../../assets/css/main.css" rel="stylesheet">
    
    <link rel="stylesheet" href="donate.css" />
</head>

<body class="index-page">
    <!-- Header Navigation -->
    <header id="header" class="header d-flex align-items-center fixed-top">
        <div class="container-fluid container-xl position-relative d-flex align-items-center">
            <a href="../../index.html" class="logo d-flex align-items-center me-auto">
                <img src="../../assets/img/alliswelllogo.png" alt="logo">
                <h1 class="sitename">All Is Well</h1>
            </a>
            <nav id="navmenu" class="navmenu">
                <ul>
                    <li><a href="../../index.html">Home</a></li>
                    <li><a href="../../index.html#about">About</a></li>
                    <li><a href="../../index.html#services">Services</a></li>
                    <li><a href="../../index.html#contact">Contact</a></li>
                </ul>
                <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
            </nav>
            <a href="index.html" class="cta-btn-donate d-flex align-items-center active">Donate Now</a>
        </div>
    </header>

    <!-- Background image -->
    <img src="hero-bg.png" class="bg-pop" alt="Decorative" />

    <div class="donate-container">
        <div class="form-and-qr">
            <!-- Form Section -->
            <div class="form-section">
                <h1>Support AllisWell</h1>
                <p>Your contribution helps us continue our mission.</p>

                <form id="donation-form">
                    <label for="name">Name</label>
                    <input type="text" id="name" required />

                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" required />

                    <button type="submit" id="donate-btn">Submit</button>
                </form>
            </div>

            <!-- QR Code Section -->
            <div class="qr-section">
                <img src="scan.png" alt="QR Code" class="qr-image" />
            </div>
        </div>
    </div>

    <script src="donate.js"></script>
</body>

</html>
